# Manual trigger for the Supabase Edge Function jobs.
# Scheduling moved to pg_cron (supabase/migrations/020_pg_cron_schedules.sql) because GitHub
# auto-disables scheduled workflows on public repos after 60 days without a commit.
# This workflow is kept only as a "run now" button for catch-up or testing.

name: Scheduled Triggers

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: both
        options: [both, daily-match, check-expiry]

jobs:
  daily-match:
    runs-on: ubuntu-latest
    if: inputs.job == 'both' || inputs.job == 'daily-match'
    steps:
      - name: Run weekly match engine and digest
        run: |
          curl -X POST \
            "https://monybdfujogcyseyjgfx.supabase.co/functions/v1/daily-match" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail-with-body

  check-expiry:
    runs-on: ubuntu-latest
    if: inputs.job == 'both' || inputs.job == 'check-expiry'
    steps:
      - name: Run expiry checker
        run: |
          curl -X POST \
            "https://monybdfujogcyseyjgfx.supabase.co/functions/v1/check-expiry" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
